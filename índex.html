<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculadora RCI - Profissional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            body { background: white; padding: 0; }
            .card { box-shadow: none; border: none; }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4">

<div class="max-w-xl mx-auto bg-white rounded-2xl shadow-xl p-6 card">
    <h1 class="text-2xl font-bold text-gray-800 text-center mb-1">Calculadora RCI</h1>
    <p class="text-center text-gray-500 mb-6 text-sm italic">Ferramenta de Triagem Clínica</p>

    <!-- Form -->
    <div class="no-print">
        <div class="mb-6">
            <label class="block text-sm font-semibold text-gray-700 mb-2">Nome do Cliente:</label>
            <input type="text" id="clienteNome" class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="Nome completo...">
        </div>

        <div class="mb-6">
            <label class="block text-sm font-semibold text-gray-700 mb-3">Selecione as Demandas:</label>
            <div class="space-y-3">
                <label class="flex items-center p-4 border rounded-xl hover:bg-gray-50 cursor-pointer transition">
                    <input type="checkbox" name="grupo" value="1" class="w-5 h-5 text-blue-600 rounded">
                    <span class="ml-3 text-gray-700">Grupo 1: Traumas, Pânico, Ansiedade</span>
                </label>
                <label class="flex items-center p-4 border rounded-xl hover:bg-gray-50 cursor-pointer transition">
                    <input type="checkbox" name="grupo" value="2" class="w-5 h-5 text-blue-600 rounded">
                    <span class="ml-3 text-gray-700">Grupo 2: Depressão, Angústia, Solidão</span>
                </label>
                <label class="flex items-center p-4 border rounded-xl hover:bg-gray-50 cursor-pointer transition">
                    <input type="checkbox" name="grupo" value="3" class="w-5 h-5 text-blue-600 rounded">
                    <span class="ml-3 text-gray-700">Grupo 3: Vícios, Transtornos, Procrastinação</span>
                </label>
                <label class="flex items-center p-4 border rounded-xl hover:bg-gray-50 cursor-pointer transition">
                    <input type="checkbox" name="grupo" value="4" class="w-5 h-5 text-blue-600 rounded">
                    <span class="ml-3 text-gray-700">Grupo 4: Abusos, Abandono, Traição</span>
                </label>
                <label class="flex items-center p-4 border rounded-xl hover:bg-gray-50 cursor-pointer transition">
                    <input type="checkbox" name="grupo" value="5" class="w-5 h-5 text-blue-600 rounded">
                    <span class="ml-3 text-gray-700">Grupo 5: Culpa, Insegurança, Fibromialgia</span>
                </label>
            </div>
        </div>

        <button onclick="gerarAnalise()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl hover:bg-blue-700 transition transform active:scale-95 shadow-lg">
            GERAR ANÁLISE
        </button>
    </div>

    <!-- Results -->
    <div id="resultado-card" class="hidden mt-8 pt-6 border-t-2 border-dashed">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-bold text-gray-800">Relatório de Análise</h2>
            <button onclick="window.print()" class="no-print bg-green-600 text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-green-700">
                Salvar PDF
            </button>
        </div>
        <p class="mb-4 text-gray-600"><strong>Cliente:</strong> <span id="resCliente"></span></p>
        <div id="lista-analise" class="space-y-4"></div>
        <button onclick="window.location.reload()" class="no-print w-full mt-8 text-gray-400 hover:text-gray-600 text-sm">
            Nova consulta
        </button>
    </div>
</div>

<script>
const baseDados = {
    '1': { t: 'Grupo 1: Sobrevivência', r: 'Sistema de Sobrevivência (Luta/Fuga)', f: 'Descondicionamento somático e regulação do SNA' },
    '2': { t: 'Grupo 2: Apego', r: 'Sistema de Apego (Privação / Perda)', f: 'Ressignificação de vazios afetivos primários' },
    '3': { t: 'Grupo 3: Recompensa', r: 'Circuito de Recompensa / Fuga da Dor', f: 'Instalação de recursos e tolerância à frustração' },
    '4': { t: 'Grupo 4: Vínculo', r: 'Ruptura de Vínculo (Imprinting relacional)', f: 'Processamento do evento raiz e reparação de limites' },
    '5': { t: 'Grupo 5: Somatização', r: 'Somatização e Sobrecarga Emocional', f: 'Reestruturação de crenças e liberação corporal' }
};

function gerarAnalise() {
    const nome = document.getElementById('clienteNome').value.trim();
    const selecionados = document.querySelectorAll('input[name="grupo"]:checked');
    
    if (!nome) { alert('Digite o nome do cliente.'); return; }
    if (selecionados.length === 0) { alert('Selecione pelo menos uma demanda.'); return; }

    const container = document.getElementById('lista-analise');
    container.innerHTML = '';
    document.getElementById('resCliente').innerText = nome;
    
    Array.from(selecionados).sort((a,b) => a.value - b.value).forEach(cb => {
        const item = baseDados[cb.value];
        container.innerHTML += `
            <div class="bg-blue-50 p-4 rounded-xl border border-blue-100">
                <h4 class="font-bold text-blue-900 text-sm mb-1">${item.t}</h4>
                <p class="text-sm text-gray-700"><strong class="text-blue-700">Raiz:</strong> ${item.r}</p>
                <p class="text-sm text-gray-700"><strong class="text-blue-700">Foco:</strong> ${item.foco}</p>
            </div>`;
    });
    
    document.getElementById('resultado-card').classList.remove('hidden');
    window.scrollTo({ top: document.getElementById('resultado-card').offsetTop, behavior: 'smooth' });
}
</script>

</body>
</html>
