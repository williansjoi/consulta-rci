<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Mapeamento Neuropsicossomático & RCI</title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --primary: #1a365d;
      --secondary: #2b6cb0;
      --accent: #2c5282;
      --text: #2d3748;
      --border: #e2e8f0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 800px;
      width: 100%;
      background: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    .header {
      text-align: center;
      border-bottom: 2px solid var(--border);
      padding-bottom: 20px;
      margin-bottom: 25px;
    }

    .header h1 {
      color: var(--primary);
      margin: 0 0 8px 0;
      font-size: 24px;
    }

    .header p {
      color: #718096;
      margin: 0;
      font-size: 14px;
    }

    .section-title {
      color: var(--primary);
      font-size: 18px;
      margin-top: 30px;
      margin-bottom: 15px;
      padding-bottom: 5px;
      border-bottom: 1px solid var(--border);
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 5px;
      color: var(--primary);
      font-size: 14px;
    }

    input[type="text"], input[type="number"], select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
      background-color: #f8fafc;
    }

    .checkbox-group {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 10px;
      margin-top: 8px;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      background: #f8fafc;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .checkbox-item input {
      margin-right: 8px;
    }

    .btn-submit {
      width: 100%;
      background-color: var(--secondary);
      color: white;
      border: none;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 30px;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background-color: var(--accent);
    }

    /* Estilo de Impressão e PDF */
    @media print {
      body {
        background: white;
        padding: 0;
      }
      .container {
        box-shadow: none;
        padding: 0;
        max-width: 100%;
      }
      .btn-submit {
        display: none;
      }
      input, select, textarea {
        border: none;
        background: transparent;
        padding: 0;
      }
      .checkbox-item {
        border: none;
        background: transparent;
        padding: 2px 0;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Sistema de Mapeamento Neuropsicossomático & RCI</h1>
    <p>Protocolo Clínico de Análise Somática e Suporte Integrativo</p>
  </div>

  <form id="evalForm">
    <!-- 1. Dados do Paciente & Linha do Tempo -->
    <div class="section-title">1. Dados do Paciente & Linha do Tempo da Dor</div>
    
    <div class="form-group">
      <label>Nome Completo do Paciente:</label>
      <input type="text" placeholder="Digite o nome..." required>
    </div>

    <div class="form-group">
      <label>Idade Atual:</label>
      <input type="number" placeholder="Ex: 38" required>
    </div>

    <div class="form-group">
      <label>Gatilho Recente (Últimos 1 a 2 anos):</label>
      <select>
        <option>Nenhum evento grave recente</option>
        <option>Perda familiar ou término afetivo</option>
        <option>Estresse financeiro ou profissional severo</option>
        <option>Mudança drástica de vida / Sobrecarga</option>
      </select>
    </div>

    <div class="form-group">
      <label>Fase Escolar e Juventude (8 aos 18 anos):</label>
      <select>
        <option>Juventude tranquila e sem grandes marcas</option>
        <option>Bullying ou rejeição escolar</option>
        <option>Pressão familiar intensa ou cobranças</option>
        <option>Conflitos de identidade ou isolamento</option>
      </select>
    </div>

    <div class="form-group">
      <label>Primeiros Anos de Vida (0 aos 7 anos):</label>
      <select>
        <option>Infância inicial segura e calma</option>
        <option>Sensação de abandono ou rejeição</option>
        <option>Ambiente familiar instável ou com conflitos</option>
        <option>Medos frequentes e hipervigilância infantil</option>
      </select>
    </div>

    <!-- 2. Pergunta por Pergunta (Grupos de Sintomas) -->
    <div class="section-title">2. Mapeamento de Sintomas e Somatizações</div>

    <!-- Grupo 1: Ansiedade e Estado de Alerta -->
    <div class="form-group">
      <label>Grupo 1: Ansiedade, Pânico e Alerta Mental</label>
      <div class="checkbox-group">
        <label class="checkbox-item"><input type="checkbox"> Ansiedade constante</label>
        <label class="checkbox-item"><input type="checkbox"> Síndrome do Pânico</label>
        <label class="checkbox-item"><input type="checkbox"> Fobias específicas</label>
        <label class="checkbox-item"><input type="checkbox"> Estresse crônico / Sobrecarga</label>
      </div>
    </div>

    <!-- Grupo 2: Sintomas Neurológicos e Cabeça -->
    <div class="form-group">
      <label>Grupo 2: Sintomas Neurológicos e Perceptivos</label>
      <div class="checkbox-group">
        <label class="checkbox-item"><input type="checkbox"> Enxaqueca / Dores de cabeça</label>
        <label class="checkbox-item"><input type="checkbox"> Zumbido no ouvido</label>
        <label class="checkbox-item"><input type="checkbox"> Tonturas / Tensão na cabeça</label>
        <label class="checkbox-item"><input type="checkbox"> Insônia / Sono agitado</label>
      </div>
    </div>

    <!-- Grupo 3: Sistema Nervoso Motor e Digestivo -->
    <div class="form-group">
      <label>Grupo 3: Respostas Físicas e Somáticas</label>
      <div class="checkbox-group">
        <label class="checkbox-item"><input type="checkbox"> Intestino preso / Constipação</label>
        <label class="checkbox-item"><input type="checkbox"> Síndrome das Pernas Inquietas</label>
        <label class="checkbox-item"><input type="checkbox"> Fibromialgia / Dores no corpo</label>
        <label class="checkbox-item"><input type="checkbox"> Tensões musculares crônicas</label>
      </div>
    </div>

    <!-- Grupo 4: Traumas e Estado Emocional Profundo -->
    <div class="form-group">
      <label>Grupo 4: Traumas e Estado Emocional</label>
      <div class="checkbox-group">
        <label class="checkbox-item"><input type="checkbox"> Depressão / Tristeza profunda</label>
        <label class="checkbox-item"><input type="checkbox"> Angústia / Vazio no peito</label>
        <label class="checkbox-item"><input type="checkbox"> Traumas / Abusos passados</label>
        <label class="checkbox-item"><input type="checkbox"> Abandono / Rejeição</label>
        <label class="checkbox-item"><input type="checkbox"> Solidão profunda</label>
      </div>
    </div>

    <!-- Grupo 5: Sentimentos e Padrões Cognitivos -->
    <div class="form-group">
      <label>Grupo 5: Sentimentos e Trava Comportamental</label>
      <div class="checkbox-group">
        <label class="checkbox-item"><input type="checkbox"> Sentimento de culpa</label>
        <label class="checkbox-item"><input type="checkbox"> Insegurança / Medo do erro</label>
        <label class="checkbox-item"><input type="checkbox"> Frustração acumulada</label>
        <label class="checkbox-item"><input type="checkbox"> Procrastinação / Autossabotagem</label>
        <label class="checkbox-item"><input type="checkbox"> Crenças limitantes</label>
        <label class="checkbox-item"><input type="checkbox"> Decepção / Dores de traição</label>
      </div>
    </div>

    <!-- Grupo 6: Comportamentos, Vícios e Intimidade -->
    <div class="form-group">
      <label>Grupo 6: Compulsões e Intimidade</label>
      <div class="checkbox-group">
        <label class="checkbox-item"><input type="checkbox"> Vícios / Dependência química</label>
        <label class="checkbox-item"><input type="checkbox"> Transtornos / Compulsão alimentar</label>
        <label class="checkbox-item"><input type="checkbox"> Disfunções sexuais</label>
      </div>
    </div>

    <!-- Observações Clínicas -->
    <div class="section-title">3. Observações Clínicas & Apontamentos RCI</div>
    <div class="form-group">
      <textarea rows="4" placeholder="Insira aqui as considerações adicionais e encaminhamentos da sessão..."></textarea>
    </div>

    <button type="button" class="btn-submit" onclick="window.print()">Gerar Relatório / Imprimir PDF</button>
  </form>
</div>

</body>
</html>
